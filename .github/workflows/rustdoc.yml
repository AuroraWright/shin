# CI that:
#
# * builds rust docs
# * adds a dummy index.html file
# * publishes the docs to gitHub pages using actions/deploy-pages

name: Rustdoc CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # rustup installs the toolchain pinned in rust-toolchain.toml
      - uses: actions/checkout@v5
      - uses: rui314/setup-mold@v1 # we use mold on Linux and rustdoc wants to have a linker for some reason
        if: runner.os == 'Linux'
        with:
          make-default: false
      - name: Install packages (Linux)
        run: sudo apt-get update && sudo apt-get install libasound2-dev libudev-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: cargo doc --no-deps
        run: cargo doc --no-deps --document-private-items
      - name: Create dummy index.html
        run: |
          echo "<meta http-equiv=refresh content=0;url=shin/index.html>" > target/doc/index.html
      # Set the right file permissions, based on https://github.com/actions/upload-pages-artifact#file-permissions.
      - name: Fix file permissions
        shell: sh
        run: |
          chmod -c -R +rX "target/doc" |
          while read line; do
              echo "::warning title=Invalid file permissions automatically fixed::$line"
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/doc
  deploy:
    needs: build

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
