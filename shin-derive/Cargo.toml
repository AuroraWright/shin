[package]
name = "shin-derive"
version = "1.0.3-fork"
edition = "2024"
description = "Shin derive macros"
repository = "https://github.com/AuroraWright/shin"
license = "MPL-2.0"
authors = ["DCNick3"]

[lib]
proc-macro = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
