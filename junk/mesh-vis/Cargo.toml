[package]
name = "mesh-vis"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
advanced = ["iced/advanced"]

[dependencies]
iced = "0.14.0"
iced_core = "0.14.0"
iced_widget = "0.14.2"

glam = "0.34.1"
# faer curently doesn't compile without the npy feature (but we don't need it) :/
faer = { version = "0.24.4", default-features = false, features = ["std", "npy"] }
float-ord = "0.3.2"


hex = "0.4.3"

[lints]
workspace = true

[package.metadata.release]
release = false
publish = false

[package.metadata.dist]
dist = false
