[package]
name = "shin"
version = "1.0.7-fork"
edition = "2024"
description = "A visual novel engine used by some entergram games"
repository = "https://github.com/AuroraWright/shin"
license = "MPL-2.0"
authors = ["DCNick3"]
default-run = "shin"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
tungstenite = "0.30.0"
shin-core = { path = "../shin-core" }
shin-render = { path = "../shin-render" }
shin-derive = { path = "../shin-derive" }
shin-tasks = { path = "../shin-tasks" }
shin-audio = { path = "../shin-audio" }
shin-input = { path = "../shin-input" }
shin-video = { path = "../shin-video" }
shin-window = { path = "../shin-window" }

toml = "=1.1.8"
anyhow = { workspace = true }
bytes = { workspace = true }
getrandom = "0.3.1"
futures = "0.3.34"

# various non-allocating/SSO containers
# TODO: consolidate
smallvec = { workspace = true }
heapless = { workspace = true }

indexmap = { workspace = true }

tracing = { workspace = true } # NOTE: enabling `release_max_level_off` increases perf a lot

clap = { version = "4.6.7", features = ["derive"] }
dirs-next = "2.0.0"

winit = { workspace = true }
wgpu = { workspace = true }

glam = { workspace = true, features = [
    # "scalar-math" disables the 16-byte alignment requirement for some types
    # this is required for bytemuck to work
    "bytemuck",
    # "scalar-math"
] }

# just one more macro crate and rust will be perfect
num-derive = "0.5.1"
num-traits = "0.2.19"
enum-map = { workspace = true }
derive_more = { version = "2.1.1", features = ["from"] }
enum_dispatch = "0.3.13"
anymap3 = "1.1.0"
derivative = "2.2.0"
from_variants = "1.0.2"
cfg-if = "1.0.5"

itertools = { workspace = true }
once_cell = "1.21.4"

egui = { workspace = true }
egui-wgpu = { workspace = true }

# kira for audio output
kira = { workspace = true }
bitflags = "2.13.2"

drop_bomb = "0.1.5"

rayon = { workspace = true }
parking_lot = { workspace = true }

replace_with = { workspace = true }

[features]
default = []
# Decode movies with an ffmpeg executable instead of the platform decoder.
ffmpeg-video = ["shin-video/ffmpeg"]
tracy = ["shin-window/tracy"]
# Internal automated acceptance entry; it never creates a manual package.
higurashi-window-probe = []

# An example, not a binary, so release packages leave it out. It lives in src/
# because it includes the application entry and its module tree.
# Build with: cargo build --release -p shin --example higurashi-window-probe
#             --features higurashi-window-probe
[[example]]
name = "higurashi-window-probe"
path = "src/higurashi_window_probe.rs"
# The normal application binary owns the shared engine test harness.
test = false
bench = false
required-features = ["higurashi-window-probe"]

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
wgpu = { workspace = true, features = ["spirv"] }
bytemuck = { workspace = true }
shin-audio = { path = "../shin-audio", features = ["reference-tests"] }
binrw = { workspace = true }
serde_json = "1.0.154"
shin-video = { path = "../shin-video", features = ["reference-tests"] }

[lints]
workspace = true

[package.metadata.release]
# this crate is not ready for publishing yet
publish = false
