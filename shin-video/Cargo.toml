[package]
name = "shin-video"
version = "1.0.0-fork"
edition = "2024"
description = "Library integrating ffmpeg with the shin engine"
repository = "https://github.com/AuroraWright/shin"
license = "MPL-2.0"
authors = ["DCNick3"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
shin-render = { path = "../shin-render" }
shin-core = { path = "../shin-core" }
shin-tasks = { path = "../shin-tasks" }
shin-audio = { path = "../shin-audio" }

mp4 = "0.14.0"
symphonia = { version = "0.6.1", features = ["aac"], default-features = false }

gst = { package = "gstreamer", version = "0.25.4", optional = true }
gst-app = { package = "gstreamer-app", version = "0.25.2", optional = true }
gst-video = { package = "gstreamer-video", version = "0.25.4", optional = true }

tracing-gstreamer = { version = "0.9.0", optional = true }

wgpu = { workspace = true }
kira = { workspace = true }
glam = { workspace = true }

anyhow = { workspace = true }
cfg-if = "1.0.5"
tracing = { workspace = true }
which = "8.0.6"

async-process = "2.5.0"
async-channel = "2.5.0"
futures-lite = "2.6.1"
num-integer = "0.1.47"

dpi = { workspace = true }

parking_lot = { workspace = true }

once_cell = "1.21.4"

[features]
reference-tests = ["shin-tasks/reference-tests"]
gstreamer = [
    "dep:gst",
    "dep:gst-app",
    "dep:gst-video",
    "dep:tracing-gstreamer",
]

[dev-dependencies]
shin-audio = { path = "../shin-audio", features = ["reference-tests"] }
shin-window = { path = "../shin-window" }
shin-input = { path = "../shin-input" }
shin-tasks = { path = "../shin-tasks", features = ["reference-tests"] }

enum-map = { workspace = true }

wgpu = { workspace = true, features = [] }
kira = { workspace = true, features = ["cpal"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true
