[package]
name = "shin-video"
version = "1.0.3-fork"
edition = "2024"
description = "Movie playback for the shin engine"
repository = "https://github.com/AuroraWright/shin"
license = "MPL-2.0"
authors = ["DCNick3"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
shin-render = { path = "../shin-render" }
shin-core = { path = "../shin-core" }
shin-tasks = { path = "../shin-tasks" }
shin-audio = { path = "../shin-audio" }

mp4 = "0.14.0"
symphonia = { version = "0.6.1", features = ["aac"], default-features = false }


wgpu = { workspace = true }
kira = { workspace = true }
glam = { workspace = true }

anyhow = { workspace = true }
cfg-if = "1.0.5"
tracing = { workspace = true }
which = "8.0.6"

async-process = "2.5.0"
async-channel = "2.5.0"
futures-lite = "2.6.1"
num-integer = "0.1.47"

dpi = { workspace = true }

parking_lot = { workspace = true }

once_cell = "1.21.4"

# Movies are decoded by the platform: VideoToolbox on macOS, Media Foundation
# on Windows and GStreamer elsewhere. An ffmpeg executable is the fallback.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-video-toolbox = "0.3.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }

[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
gst = { package = "gstreamer", version = "0.25.4" }
gst-app = { package = "gstreamer-app", version = "0.25.2" }
gst-video = { package = "gstreamer-video", version = "0.25.4" }

[features]
reference-tests = ["shin-tasks/reference-tests"]
# Always decode movies with an ffmpeg executable instead of the platform decoder.
ffmpeg = []

[dev-dependencies]
shin-audio = { path = "../shin-audio", features = ["reference-tests"] }
shin-window = { path = "../shin-window" }
shin-input = { path = "../shin-input" }
shin-tasks = { path = "../shin-tasks", features = ["reference-tests"] }

enum-map = { workspace = true }

wgpu = { workspace = true, features = [] }
kira = { workspace = true, features = ["cpal"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true
