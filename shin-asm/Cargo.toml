[package]
name = "shin-asm"
version = "1.0.0-fork"
edition = "2024"
description = "Assembler and disassembler library for the shin VM"
repository = "https://github.com/AuroraWright/shin"
license = "MPL-2.0"
authors = ["DCNick3"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
shin-derive = { path = "../shin-derive" }
shin-core = { path = "../shin-core" }

assert_matches = "1.5.0"

rustc-hash = "2.1.3"
smol_str = "0.3.6"
la-arena = "0.3.1"

typenum = "1.20.1"

strip-ansi-escapes = "0.2.1"
itertools = { workspace = true }

binrw = { workspace = true }

unicode-xid = "0.2.6"
unic-emoji-char = "0.9.0"

either = "1.19.0"
nonmax = "0.5.5"
bind_match = "0.1.2"

drop_bomb = "0.1.5"
rowan = "0.17.0"
text-size = "1.1.1"
salsa = "0.28.5"
ariadne = "0.6.0"

[dev-dependencies]
expect-test = "1.5.1"
indoc = "2.0.8"
pretty-hex = "0.4.2"

[build-dependencies]
build-deps = "0.1.4"

[lints]
workspace = true
