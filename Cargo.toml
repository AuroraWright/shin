[workspace]
members = [
    "shin-derive",
    "shin-core",
    "shin-render",
    "shin-render-shader-types",
    "shin-render-shaders",
    "shin-video",
    "shin-tasks",
    "shin-audio",
    "shin-asm",
    "shin-window",
    "shin-input",
    "shin-primitives",
    "sdu",
    "shin",
    "junk",
    "junk/mesh-vis",
]
resolver = "2"

[workspace.dependencies]
# glam provides the matching encase uniform integration.
glam = { version = "0.34.1", features = ["encase-013"] }
dpi = "0.1.2"

# Stable enum-map retains GAT-backed enum maps.
enum-map = "3.1.0"
smallvec = { version = "1.16.3", features = ["const_generics"] }
heapless = "0.9.3"
indexmap = "2.14.2"

wgpu = { version = "30.0.1", features = ["trace"] }
winit = "0.30.13"

# egui used for debug overlays
egui = "0.36.2"
egui-wgpu = "0.36.2"

kira = { version = "0.12.5", default-features = false }

image = { version = "0.25.10", default-features = false }

tracing = "0.1.44"
anyhow = "1.0.104"

itertools = "0.15.0"
binrw = "0.15.2"

bytes = "1.12.1"

# TODO: replace uses of `strum` with `enum-iterator` crate
strum = "0.28.0"
enum-iterator = "2.3.0"
bytemuck = "1.25.2"
# Be careful when updating! We rely on private & internal APIs
encase = "0.13.0"

# TODO: migrate more things to parking_lot
# running with deadlock detection for now because I've been getting rare deadlocks in wgpu :/
parking_lot = { version = "0.12.5", features = ["deadlock_detection", "arc_lock"] }

replace_with = "0.1.8"

rayon-core = "1.13.0"
rayon = "1.12.0"

[profile.release]
debug = true
#lto = 'thin'

# optimize deps
[profile.dev.package."*"]
#opt-level = 2

[profile.release.package.wgpu-core]
# enable debug assertions to keep validations & debug labels
# they are still disabled in `dist` profile used to build the release
debug-assertions = true

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
debug = false
lto = "thin"

[workspace.lints.clippy]
bool_comparison = "allow"
bool_assert_comparison = "allow"
new_without_default = "allow"
let_and_return = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
useless_format = "allow"

[workspace.metadata.release]
shared-version = true
publish = false # workspace release readiness is tracked separately
tag-prefix = ""
