[package]
name = "shin-core"
version = "1.0.1-fork"
edition = "2024"
description = "Core library for the Shin engine: file formats support, virtual machine, etc"
repository = "https://github.com/AuroraWright/shin"
license = "MPL-2.0"
authors = ["DCNick3"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
shin-primitives = { path = "../shin-primitives" }
shin-tasks = { path = "../shin-tasks" }

# derive macros
num-traits = "0.2.19"
num-derive = "0.5.1"
shin-derive = { path = "../shin-derive" }
derive_more = { version = "2.1.1", features = ["add", "add_assign"] }
enum-map = { workspace = true }
binrw = { workspace = true }
strum = { workspace = true, features = ["derive"] }
proc-bitfield = "0.5.3"
derivative = "2.2.0"
snafu = "0.9.2"

anyhow = { workspace = true }
bitflags = "2.13.2"
bytemuck = { workspace = true, features = ["derive"] }
bytes = { workspace = true }
glam = { workspace = true }
float-ord = "0.3.2"
image = { workspace = true, default-features = false }
flate2 = { version = "1.0.35", default-features = false, features = ["rust_backend"] }
itertools = { workspace = true }
smallvec = { workspace = true }
tracing = { workspace = true }
smartstring = "1.0.1"
once_cell = "1.21.4"
bitvec = "1.1.1"
opus = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-big-array = "0.5.1"
num-integer = "0.1.47"
chrono = { version = "0.4.45", features = ["serde"] }
indexmap = { workspace = true }

rayon = { workspace = true }
parking_lot = { workspace = true }

array-util = "1.0.2"

[dev-dependencies]
hex = "0.4.3"
serde_json = "1.0.154"
insta = { version = "1.49.0", features = ["ron"] }
similar-asserts = "2.0.0"
rand = "0.10.3"
zstd = "0.14.2"
minicbor = { version = "2.3.0", features = ["derive", "std"] }

[lints]
workspace = true
