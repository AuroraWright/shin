[package]
name = "shin-window"
version = "1.0.3-fork"
edition = "2024"

[dependencies]
shin-primitives = { path = "../shin-primitives" }
shin-tasks = { path = "../shin-tasks" }
shin-input = { path = "../shin-input" }
shin-render = { path = "../shin-render" }

tracing = { workspace = true }

tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-tracy = { version = "0.12.0", default-features = false, features = [
    "system-tracing",
    "context-switch-tracing",
    "sampling",
    "code-transfer",
    "broadcast",
    "callstack-inlines",
] }
tracy-client = { version = "0.19.0", default-features = false, features = [
    "system-tracing",
    "context-switch-tracing",
    "sampling",
    "code-transfer",
    "broadcast",
    "callstack-inlines",
    "timer-fallback", # Pair with TRACY_DISALLOW_HW_TIMER in .cargo/config.toml.
] }

cfg-if = "1.0.5"

enum-map = { workspace = true }

winit = { workspace = true, features = ["android-native-activity"] }
wgpu = { workspace = true }

anyhow = { workspace = true }
derive-where = "1.7.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.106", features = ["Document"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"

[features]
tracy = ["tracing-tracy/enable"]

[dev-dependencies]
dpi = { workspace = true }
glam = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
console_error_panic_hook = "0.1.7"
tracing-wasm = { version = "0.2.1" }

[lints]
workspace = true
