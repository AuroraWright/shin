# exefs_texts.txt:29 (0x15c582); reviewed-native-leading-size-prefix
"@z110.■第一の晩@z100.@r「惨たらしい殺され方でした……。@c649.私でなくとも、誰も検死は誤りません@c999.」@r@z25.@r@z100.@z110.■第二の晩@z100.@r「はい。@c649.私が二人の死亡を確認しました。あれは間違いなく即死でした@c999.」@r@z25.@r@z100.「そもそも、屋敷自体を保全するべきではということになりましてな。@c649.屋敷自体にも封印をし、私たちは全員、ゲストハウスへ避難しました@c999.」@r@z25.@r@z100.@z110.■第四の晩@z100.@r「無論、@c649.私も検死し、彼女の死亡を確認しました@c999.」@r@z25.@r@z100.@z110.■第五・六の晩@z100.@r「@c649.郷田さんも熊沢さんも、この傷では即死@c999.だったでしょう。惨たらしい死に方です…」" = "@z110.- First twilight@r\"It was such a terrible way to be killed...... @c649.Doctor or not, no one examining a body will reach the wrong conclusion@c999..\"@r@r- Second twilight@r\"Correct. @c649.I confirmed both of their deaths. There can be no doubt that they died instantly@c999..\"@r\"We reached the conclusion that the entire mansion itself should be preserved. @c649.We also sealed the mansion itself, and all of us took refuge in the guesthouse@c999..\"@r@r- Fourth twilight@r\"Of course, @c649.I also examined her and confirmed her death@c999..\"@r@r- Fifth and sixth twilights@r\"@c649.Judging by these wounds, Gohda-san and Kumasawa-san died instantly@c999., I believe. Such a gruesome way to die...\""
# exefs_texts.txt:30 (0x16375c); reviewed-native-leading-size-prefix
"@z110.■第一の晩@z100.@r「もちろん、@c649.食堂内何者かが隠れているということもなかったよ@c999.」@r@z25.@r@z100.@z110.■第四の晩@z100.@r「生きててくれと願ったさ。でも、@c649.僕は彼女が死んでいることを認めなければならなかった…@c999.」@r@z25.@r@z100.@z110.■第五・六の晩@z100.@r「何者かの侵入を疑って調べたけれど、@c649.ゲストハウスの戸締りは完璧だったよ@c999.」@r@z25.@r@z100.@z110.■第七の晩@z100.@r「僕でさえ、@c649.これは即死だったに違いない@c999.と一目でわかるよ…」@r@z25.@r@z100.「そもそも、@c649.ゲストハウス内で南條先生を殺すことは不可能なんだ！@c999.」@r@z25.@r@z100.@z110.■第八の晩@z100.@r「朱志香ちゃん、……可哀想に。@c649.即死だったろう@c999.」@r@z25.@r@z100.「真里亞ちゃんが人なんか殺すもんか。@c649.真里亞ちゃんには誰も殺せないよ@c999.」" = "@z110.- First twilight@r\"Of course, @c649.there was no one hiding in the dining hall either@c999..\"@r@r- Fourth twilight@r\"I prayed she was still alive. However, @c649.I was forced to acknowledge that she was dead@c999....\"@r@r- Fifth and sixth twilights@r\"I guessed that someone might have snuck in, so I checked around, @c649.but the guesthouse was still completely locked up@c999..\"@r@r- Seventh twilight@r\"Even I...can say for sure that @c649.this was an instant death@c999....\"@r\"In the first place, @c649.no one could kill Doctor Nanjo inside the guesthouse@c999.!\"@r@r- Eighth twilight@r\"Poor......Jessica-chan. @c649.She probably died instantly@c999..\"@r\"As if Maria-chan could kill someone. @c649.Maria-chan couldn't kill anyone@c999..\""
# exefs_texts.txt:31 (0x15d85d); reviewed-native-leading-size-prefix
"@z110.■第一の晩@z100.@r「そして、@c649.食堂内から、不審なものは何も見つからなかった@c999.」@r@z25.@r@z100.@z110.■第二の晩@z100.@r「@c649.南條先生がすぐ脈を取ったぜ。そして、二人とも即死だったと宣言した@c999.」@r@z25.@r@z100.「となりゃ、食堂も同じだ。@c649.俺たちはさらに食堂も同様に封印した@c999.」@r@z25.@r@z100.@z110.■第四の晩@z100.@r「逆に言えば。@c649.……譲治の兄貴以外なら誰にでも殺せたわけだ@c999.」@r@z25.@r@z100.@z110.■第五・六の晩@z100.@r「戸締り確認とか見回りとか、色々やってたからな。今回もまた、@c649.俺たちには全員、アリバイがない@c999.」@r@z25.@r@z100.「それはありえねぇぜ。@c649.マスターキーはもう、ここで死んでる２人の２本以外、存在しない@c999.」@r@z25.@r@z100.@z110.■第七の晩@z100.@r「しかも、これを見ろよ。つまりこいつは、@c649.南條先生がゲストハウスを出ていない証拠だ…！@c999.」@r@z25.@r@z100.@z110.■第八の晩@z100.@r「俺たちは３人でずっと一緒だった！　@c649.俺も譲治の兄貴も真里亞も、朱志香は殺せねぇぞ！@c999.」" = "@z110.- First twilight@r\"And @c649.nothing suspicious was found inside the dining hall@c999..\"@r@r- Second twilight@r\"@c649.Doctor Nanjo checked their pulse. Then, he announced that the two of them had died instantly@c999..\"@r\"Then, we did the same to the dining hall. @c649.We also sealed the dining hall in the same way@c999..\"@r@r- Fourth twilight@r\"To turn it around, @c649.......anyone could have killed her besides George-aniki@c999..\"@r@r- Fifth and sixth twilights@r\"Well, we have been busy, keeping a lookout and locking up and all that. Once again, @c649.none of us has an alibi@c999..\"@r\"That's impossible. @c649.No master keys exist anymore except the two keys on the two people who lie dead here@c999..\"@r@r- Seventh twilight@r\"And look at this. Simply put, @c649.this is proof that Doctor Nanjo didn't leave the guesthouse@c999....!\"@r@r- Eighth twilight@r\"The three of us were together the whole time! @c649.George-aniki, Maria and I couldn't have killed Jessica@c999.!\""
# exefs_texts.txt:32 (0x15b027); reviewed-native-leading-size-prefix
"@z110.■第一の晩@z100.@r「@c649.犠牲者はみんな、即死@c999.だったろうね。……きひひひひひ」@r@z25.@r@z100.@z110.■第二の晩@z100.@r「@c649.外からガムテープでベタベタと、窓や扉を封印したよ！@c999.」@r@z25.@r@z100.@z110.■第七の晩@z100.@r「@c649.戸締りは完璧だよ。@c999.密室なのにどうして？」@r@z25.@r@z100.@z110.■第八の晩@z100.@r「@c649.これで生きているわけがない@c999.もんね。きひひひひ」@r@z25.@r@z100.「うん。@c649.私たち３人に朱志香は殺せない@c999.」@r@z25.@r@z100.「きひひ、ありがとう。@c649.譲治お兄ちゃんだって、大人は殺せないよ。子供は殺せるけれど。@c999.きひひひひひひ」" = "@z110.- First twilight@r\"Looks like @c649.all of the victims died instantly@c999.. ......Kihihihihi.\"@r@r- Second twilight@r\"@c649.We put duct tape all over the outside of the doors and windows, sealing them@c999.!\"@r@r- Seventh twilight@r\"@c649.Everything is locked up perfectly@c999.. How did it happen, if this is a locked room?\"@r@r- Eighth twilight@r\"@c649.There's no way she could live through this@c999.. Kihihihihi.\"@r\"Yeah. @c649.The three of us couldn't have killed Jessica@c999..\"@r\"Kihihi, thanks. @c649.George onii-chan couldn't kill an adult. He could kill a kid though@c999.. Kihihihihihi.\""
# exefs_texts.txt:33 (0x161012); reviewed-native-leading-size-prefix
"@z110.■第一の晩@z100.@r「@c649.僕と南條先生は、源次さまが死んでいることを確認しました@c999.」@r@z25.@r@z100.@z110.■第二の晩@z100.@r「@c649.部屋の中には、蔵臼さまと夏妃さまが倒れていました@c999.」@r@z25.@r@z100.「@c649.僕たち使用人全員は、それぞれが使用人全員のアリバイを証明できます@c999.」" = "@z110.- First twilight@r\"@c649.Doctor Nanjo and I confirmed that Genji-sama was dead@c999..\"@r@r- Second twilight@r\"@c649.Krauss-sama and Natsuhi-sama lay sprawled on the floor inside the room@c999..\"@r\"@c649.All of us servants can prove an alibi for all of the other servants@c999..\""
